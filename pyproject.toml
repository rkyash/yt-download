[project]
name = "yt-download"
version = "1.0.0"
description = "Modern YouTube downloader with CustomTkinter GUI and yt-dlp backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "customtkinter>=5.2.0",
    "yt-dlp>=2024.1.1",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.scripts]
yt-download = "main:main"
