name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Download FFmpeg for Windows
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extract"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-extract" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "ffmpeg.exe"

      - name: Build with PyInstaller
        run: uv run pyinstaller YTDownloader.spec

      - name: Rename artifact
        run: |
          Rename-Item -Path "dist\YTDownloader.exe" -NewName "YTDownloader-windows-x64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: YTDownloader-windows-x64
          path: dist/YTDownloader-windows-x64.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-tk \
            python3-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxss-dev \
            libxtst-dev \
            libfreetype6-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Download FFmpeg for Linux
        run: |
          wget -q "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          FFMPEG_BIN=$(find . -type f -name "ffmpeg" -path "*/bin/ffmpeg" | head -n 1)
          cp "$FFMPEG_BIN" ./ffmpeg
          chmod +x ./ffmpeg

      - name: Build with PyInstaller
        run: uv run pyinstaller YTDownloader.spec

      - name: Prepare Linux binary
        run: |
          chmod +x dist/YTDownloader
          mv dist/YTDownloader dist/YTDownloader-linux-x64

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: YTDownloader-linux-x64
          path: dist/YTDownloader-linux-x64
          if-no-files-found: error


      - name: Build .deb package
        run: |
          VERSION="${RELEASE_VERSION#v}"

          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/local/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/256x256/apps

          cat > deb-package/DEBIAN/control << EOF
          Package: ytdownloader
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: ffmpeg, python3
          Maintainer: rkyash
          Description: Modern YouTube downloader with GUI
           A modern YouTube downloader application with a CustomTkinter GUI and yt-dlp backend.
           Supports video/audio downloads, queue management, and playlist downloads.
          EOF

          # Remove leading whitespace from control file (heredoc indentation)
          sed -i 's/^          //' deb-package/DEBIAN/control

          cp dist/YTDownloader-linux-x64 deb-package/usr/local/bin/ytdownloader
          chmod 755 deb-package/usr/local/bin/ytdownloader

          cat > deb-package/usr/share/applications/ytdownloader.desktop << EOF
          [Desktop Entry]
          Name=YT Downloader
          Comment=Modern YouTube Downloader
          Exec=/usr/local/bin/ytdownloader
          Icon=ytdownloader
          Terminal=false
          Type=Application
          Categories=Network;AudioVideo;
          EOF

          # Remove leading whitespace from desktop file
          sed -i 's/^          //' deb-package/usr/share/applications/ytdownloader.desktop

          dpkg-deb --build deb-package YTDownloader-linux-x64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: YTDownloader-linux-x64-deb
          path: YTDownloader-linux-x64.deb
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: List downloaded files
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: YT Downloader ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            YTDownloader-windows-x64.exe
            YTDownloader-linux-x64
            YTDownloader-linux-x64.deb
